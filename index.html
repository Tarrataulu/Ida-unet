<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDA UNET</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #fff5fb, #ffe6f2);
      text-align: center;
      color: #7a3b69;
      overflow-x: hidden;
    }

    .container {
      padding: 30px 20px 50px;
      max-width: 1200px;
      margin: auto;
    }

    h1 {
      color: #ff4fa3;
      font-size: 56px;
      margin-bottom: 10px;
    }

    p {
      font-size: 28px;
      margin-bottom: 40px;
    }

    .stars {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: nowrap;
      overflow-x: auto;
      padding: 10px 20px 30px;
      box-sizing: border-box;
    }

    .stars::-webkit-scrollbar {
      height: 8px;
    }

    .stars::-webkit-scrollbar-thumb {
      background: #ffb6d9;
      border-radius: 20px;
    }

    .star {
      width: 100px;
      height: 100px;
      background: white;
      border-radius: 28px;
      border: 4px solid #ffd1e8;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 6px 14px rgba(255, 105, 180, 0.18);
      transition: transform 0.2s;
    }

    .star:hover {
      transform: scale(1.05);
    }

    .icon {
      font-size: 54px;
    }

    .number {
      position: absolute;
      font-size: 28px;
      font-weight: bold;
      color: white;
      display: none;
      text-shadow: 0 2px 5px rgba(0,0,0,0.35);
    }

    #reward {
      display: none;
      margin-top: 35px;
      font-size: 34px;
      color: #ff4fa3;
      animation: pop 0.6s ease;
    }

    button {
      margin-top: 25px;
      background: #ff74b8;
      color: white;
      border: none;
      border-radius: 18px;
      padding: 14px 28px;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 105, 180, 0.3);
    }

    @keyframes pop {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @media (max-width: 700px) {
      h1 {
        font-size: 38px;
      }

      p {
        font-size: 22px;
      }

      .star {
        width: 82px;
        height: 82px;
      }

      .icon {
        font-size: 44px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🌙 IDA UNET ✨</h1>
  <p>Klikkaa päivän tähteä hyvän yön jälkeen!</p>

  <div class="stars" id="stars"></div>

  <div id="reward">
    🎉 Mahtavaa IDA! Pääset muumimaailmaan! 🎉✨
  </div>

  <button onclick="resetStars()">Aloita alusta</button>
</div>

<script>
  const starsContainer = document.getElementById('stars');
  const reward = document.getElementById('reward');
  const sound = new Audio('https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=correct-2-46134.mp3');

  let completed = Number(localStorage.getItem('completedStars')) || 0;
  let lastClickDate = localStorage.getItem('lastClickDate') || '';

  function renderStars() {
    starsContainer.innerHTML = '';

    for (let i = 1; i <= 4; i++) {
      const star = document.createElement('div');
      star.className = 'star';

      const icon = document.createElement('div');
      icon.className = 'icon';
      icon.textContent = i <= completed ? '⭐' : '☆';

      const number = document.createElement('div');
      number.className = 'number';
      number.textContent = i;

      if (i <= completed) {
        number.style.display = 'block';
      }

      star.appendChild(icon);
      star.appendChild(number);

      star.addEventListener('click', () => {
        const today = new Date().toDateString();

        if (lastClickDate === today) {
          alert('Voit kerätä yhden tähden päivässä 🌙');
          return;
        }

        if (i === completed + 1) {
          completed++;
          localStorage.setItem('completedStars', completed);

          lastClickDate = today;
          localStorage.setItem('lastClickDate', today);

          sound.currentTime = 0;
          sound.play();

          renderStars();
        }
      });

      starsContainer.appendChild(star);
    }

    if (completed === 4) {
      reward.style.display = 'block';
    } else {
      reward.style.display = 'none';
    }
  }

  function resetStars() {
    const ok = confirm('Haluatko varmasti aloittaa alusta? 🌙');

    if (!ok) return;

    completed = 0;
    lastClickDate = '';

    localStorage.removeItem('completedStars');
    localStorage.removeItem('lastClickDate');

    renderStars();
  }

  renderStars();
</script>

</body>
</html>
